<svg width="420" height="120" viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090c"/>
      <stop offset="100%" stop-color="#0d1a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00c9a7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#07090c" stop-opacity="0"/>
    </radialGradient>
    <filter id="eGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lineGlow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c9a7" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00c9a7" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#00c9a7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00c9a7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="420" height="120" rx="12"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="420" height="120" rx="12" fill="url(#bg)"/>
  <rect width="420" height="120" rx="12" fill="url(#glow)" clip-path="url(#card)"/>

  <!-- Border -->
  <rect width="420" height="120" rx="12" fill="none" stroke="#00c9a7" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Left accent line -->
  <rect x="0" y="0" width="3" height="120" rx="1.5" fill="#00c9a7" fill-opacity="0.7"/>

  <!-- Circuit decorations -->
  <g fill="none" stroke="#00c9a7" stroke-width="0.6" opacity="0.10">
    <path d="M 30,15 H 60 V 8 H 100"/>
    <path d="M 60,15 V 30 H 40 V 45"/>
    <path d="M 380,20 H 350 V 12 H 310"/>
    <path d="M 350,20 V 35 H 370 V 50"/>
    <path d="M 30,100 H 70 V 108 H 110"/>
    <path d="M 390,100 H 360 V 108 H 320"/>
  </g>
  <g fill="#00c9a7" opacity="0.15">
    <circle cx="100" cy="8" r="2"/>
    <circle cx="40" cy="45" r="2"/>
    <circle cx="310" cy="12" r="2"/>
    <circle cx="370" cy="50" r="2"/>
    <circle cx="110" cy="108" r="2"/>
    <circle cx="320" cy="108" r="2"/>
  </g>

  <!-- E logo circle -->
  <circle cx="60" cy="60" r="34" fill="#07090c" stroke="#00c9a7" stroke-width="1" stroke-opacity="0.35"/>
  <circle cx="60" cy="60" r="28" fill="#00c9a7" fill-opacity="0.04" stroke="#00c9a7" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- E letter -->
  <text x="60" y="73"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="42" font-weight="900" letter-spacing="-2"
    fill="#00c9a7" text-anchor="middle"
    filter="url(#eGlow)">E</text>

  <!-- Orbital dot on circle -->
  <circle cx="60" cy="26" r="3" fill="#00c9a7" opacity="0.8" filter="url(#eGlow)"/>
  <circle cx="94" cy="60" r="2.5" fill="#00c9a7" opacity="0.5"/>

  <!-- Main title -->
  <text x="113" y="48"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="22" font-weight="800" letter-spacing="3"
    fill="#ffffff">ECHO OBLIVION</text>

  <!-- Subtitle -->
  <text x="114" y="68"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="11" font-weight="500" letter-spacing="2"
    fill="#00c9a7" opacity="0.85">⚡ AI AGENT SYSTEM · V20|26</text>

  <!-- Divider -->
  <line x1="113" y1="78" x2="390" y2="78" stroke="#00c9a7" stroke-width="0.5" stroke-opacity="0.2" filter="url(#lineGlow)"/>

  <!-- Stat pills -->
  <!-- Pill 1 -->
  <rect x="113" y="86" width="72" height="20" rx="10"
    fill="#00c9a7" fill-opacity="0.08" stroke="#00c9a7" stroke-width="0.7" stroke-opacity="0.3"/>
  <text x="149" y="100"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="9.5" font-weight="600" letter-spacing="0.8"
    fill="#00c9a7" text-anchor="middle">391 CMDS</text>

  <!-- Pill 2 -->
  <rect x="193" y="86" width="68" height="20" rx="10"
    fill="#00c9a7" fill-opacity="0.08" stroke="#00c9a7" stroke-width="0.7" stroke-opacity="0.3"/>
  <text x="227" y="100"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="9.5" font-weight="600" letter-spacing="0.8"
    fill="#00c9a7" text-anchor="middle">PHASE 3</text>

  <!-- Pill 3 -->
  <rect x="269" y="86" width="74" height="20" rx="10"
    fill="#00c9a7" fill-opacity="0.08" stroke="#00c9a7" stroke-width="0.7" stroke-opacity="0.3"/>
  <text x="306" y="100"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="9.5" font-weight="600" letter-spacing="0.8"
    fill="#00c9a7" text-anchor="middle">MULTI-AI</text>

  <!-- Pill 4 -->
  <rect x="351" y="86" width="52" height="20" rx="10"
    fill="#00c9a7" fill-opacity="0.08" stroke="#00c9a7" stroke-width="0.7" stroke-opacity="0.3"/>
  <text x="377" y="100"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="9.5" font-weight="600" letter-spacing="0.8"
    fill="#00c9a7" text-anchor="middle">24/7</text>

  <!-- Bottom glow strip -->
  <rect x="40" y="118" width="340" height="2" rx="1" fill="url(#barGrad)"/>
</svg>
