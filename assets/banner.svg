<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090c"/>
      <stop offset="55%" stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#0a1a14"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00c9a7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#07090c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="circleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00c9a7" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#07090c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#07090c" stop-opacity="1"/>
    </radialGradient>
    <filter id="eGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c9a7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00c9a7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00c9a7" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#00c9a7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00c9a7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="canvas">
      <rect width="1280" height="640"/>
    </clipPath>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#centerGlow)"/>

  <!-- CIRCUIT / NETWORK PATTERN -->
  <g clip-path="url(#canvas)" opacity="1">
    <g fill="none" stroke="#00c9a7" stroke-width="0.8" opacity="0.07">
      <path d="M 40,55 H 130 V 38 H 210"/>
      <path d="M 130,38 V 18 H 280 H 340 V 38"/>
      <path d="M 340,38 H 440 V 18 H 560"/>
      <path d="M 210,55 V 82 H 165 V 110"/>
      <path d="M 440,38 V 70 H 400 V 100"/>
      <path d="M 560,18 H 680 V 48 H 740"/>
      <path d="M 680,48 V 85 H 620 V 115"/>
      <path d="M 740,48 H 860 V 22 H 960"/>
      <path d="M 860,22 H 960 V 55 H 1040"/>
      <path d="M 1040,55 H 1140 V 30 H 1240"/>
      <path d="M 1140,30 V 70 H 1200 V 110"/>
      <path d="M 1240,30 V 55"/>
      <path d="M 30,140 H 90 V 160 H 165"/>
      <path d="M 90,160 V 185 H 40 V 210"/>
      <path d="M 165,160 H 260 V 140 H 360"/>
      <path d="M 260,140 V 115"/>
      <path d="M 360,140 H 450 V 165 H 510"/>
      <path d="M 450,165 V 190 H 380 V 215"/>
      <path d="M 760,85 V 140 H 820 V 165"/>
      <path d="M 820,165 H 900 V 140 H 980"/>
      <path d="M 980,140 H 1060 V 165 H 1120"/>
      <path d="M 1120,165 H 1200 V 140 H 1260 V 105"/>
      <path d="M 30,490 H 100 V 510 H 180"/>
      <path d="M 100,510 V 540 H 50 V 570"/>
      <path d="M 180,510 H 280 V 490 H 380"/>
      <path d="M 280,490 V 465"/>
      <path d="M 380,490 H 470 V 520 H 530"/>
      <path d="M 1240,490 H 1180 V 510 H 1100"/>
      <path d="M 1180,510 V 540 H 1230 V 570"/>
      <path d="M 1100,510 H 1000 V 490 H 900"/>
      <path d="M 900,490 V 465"/>
      <path d="M 30,590 H 120 V 610 H 200"/>
      <path d="M 1250,590 H 1160 V 610 H 1080"/>
    </g>

    <!-- Node dots -->
    <g fill="#00c9a7" opacity="0.18">
      <circle cx="130" cy="38" r="2.5"/>
      <circle cx="340" cy="38" r="2.5"/>
      <circle cx="560" cy="18" r="2.5"/>
      <circle cx="860" cy="22" r="2.5"/>
      <circle cx="1140" cy="30" r="2.5"/>
      <circle cx="165" cy="110" r="2"/>
      <circle cx="400" cy="100" r="2"/>
      <circle cx="620" cy="115" r="2"/>
      <circle cx="1200" cy="110" r="2"/>
      <circle cx="260" cy="140" r="2"/>
      <circle cx="820" cy="165" r="2"/>
      <circle cx="1060" cy="165" r="2"/>
      <circle cx="100" cy="510" r="2.5"/>
      <circle cx="280" cy="490" r="2.5"/>
      <circle cx="1180" cy="510" r="2.5"/>
      <circle cx="900" cy="490" r="2.5"/>
    </g>
  </g>

  <!-- MAIN CIRCLE -->
  <circle cx="320" cy="320" r="200" fill="url(#circleGlow)" stroke="#00c9a7" stroke-width="1.2" stroke-opacity="0.22"/>
  <circle cx="320" cy="320" r="168" fill="none" stroke="#00c9a7" stroke-width="0.6" stroke-opacity="0.10" stroke-dasharray="4 8"/>
  <circle cx="320" cy="320" r="210" fill="none" stroke="#00c9a7" stroke-width="0.5" stroke-opacity="0.07"/>

  <!-- Orbital dots on main circle -->
  <circle cx="320" cy="120" r="5" fill="#00c9a7" opacity="0.85" filter="url(#dotGlow)"/>
  <circle cx="507" cy="213" r="3.5" fill="#00c9a7" opacity="0.60" filter="url(#dotGlow)"/>
  <circle cx="507" cy="427" r="3" fill="#00c9a7" opacity="0.40" filter="url(#dotGlow)"/>
  <circle cx="133" cy="213" r="3" fill="#00c9a7" opacity="0.40" filter="url(#dotGlow)"/>
  <circle cx="133" cy="427" r="2.5" fill="#00c9a7" opacity="0.30"/>

  <!-- Connector lines from dots -->
  <line x1="320" y1="120" x2="320" y2="155" stroke="#00c9a7" stroke-width="0.8" stroke-opacity="0.30"/>
  <line x1="507" y1="213" x2="488" y2="228" stroke="#00c9a7" stroke-width="0.6" stroke-opacity="0.22"/>

  <!-- E LETTER -->
  <text x="320" y="385"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="220" font-weight="900" letter-spacing="-8"
    fill="#00c9a7" text-anchor="middle"
    filter="url(#eGlow)">E</text>

  <!-- CONTENT — right side -->
  <!-- Main title -->
  <text x="640" y="258"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="62" font-weight="900" letter-spacing="6"
    fill="#ffffff" text-anchor="middle"
    filter="url(#textGlow)">ECHO OBLIVION</text>

  <!-- Tagline -->
  <text x="640" y="308"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="17" font-weight="400" letter-spacing="4"
    fill="#ffffff" opacity="0.45" text-anchor="middle">THE WHATSAPP BOT THAT FEELS ALIVE</text>

  <!-- Horizontal rule -->
  <line x1="495" y1="334" x2="785" y2="334" stroke="#00c9a7" stroke-width="0.8" stroke-opacity="0.35" filter="url(#dotGlow)"/>

  <!-- OBLIVION quote -->
  <text x="640" y="370"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="14" font-weight="400" letter-spacing="1.5" font-style="italic"
    fill="#ffffff" opacity="0.38" text-anchor="middle">"I am OBLIVION. The intelligence that always lived inside Echo."</text>

  <!-- Stats row -->
  <text x="505" y="400"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="28" font-weight="800" letter-spacing="1"
    fill="#00c9a7" text-anchor="middle"
    filter="url(#dotGlow)">391</text>
  <text x="505" y="420"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="10" font-weight="500" letter-spacing="2"
    fill="#ffffff" opacity="0.40" text-anchor="middle">COMMANDS</text>

  <line x1="560" y1="393" x2="560" y2="422" stroke="#00c9a7" stroke-width="0.6" stroke-opacity="0.25"/>

  <text x="640" y="400"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="28" font-weight="800" letter-spacing="1"
    fill="#00c9a7" text-anchor="middle"
    filter="url(#dotGlow)">3</text>
  <text x="640" y="420"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="10" font-weight="500" letter-spacing="2"
    fill="#ffffff" opacity="0.40" text-anchor="middle">PHASES</text>

  <line x1="720" y1="393" x2="720" y2="422" stroke="#00c9a7" stroke-width="0.6" stroke-opacity="0.25"/>

  <text x="775" y="400"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="28" font-weight="800" letter-spacing="1"
    fill="#00c9a7" text-anchor="middle"
    filter="url(#dotGlow)">24/7</text>
  <text x="775" y="420"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="10" font-weight="500" letter-spacing="2"
    fill="#ffffff" opacity="0.40" text-anchor="middle">UPTIME</text>

  <!-- Protocol line -->
  <line x1="495" y1="432" x2="600" y2="432" stroke="#00c9a7" stroke-width="0.7" stroke-opacity="0.40"/>
  <text x="640" y="436"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="10" font-weight="600" letter-spacing="3"
    fill="#00c9a7" text-anchor="middle"
    opacity="0.55">E C H O   S Y S T E M   P R O T O C O L</text>
  <line x1="680" y1="432" x2="785" y2="432" stroke="#00c9a7" stroke-width="0.7" stroke-opacity="0.40"/>

  <!-- Divider -->
  <line x1="495" y1="456" x2="785" y2="456" stroke="#00c9a7" stroke-width="0.5" stroke-opacity="0.18"/>

  <!-- Badge row -->
  <rect x="495" y="470" width="158" height="30" rx="15" ry="15"
    fill="#00c9a7" fill-opacity="0.08"
    stroke="#00c9a7" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="574" y="490"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="11" font-weight="600" letter-spacing="1"
    fill="#00c9a7" text-anchor="middle">⚡ OBLIVION AGENT</text>

  <rect x="663" y="470" width="152" height="30" rx="15" ry="15"
    fill="#00c9a7" fill-opacity="0.08"
    stroke="#00c9a7" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="739" y="490"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="11" font-weight="600" letter-spacing="1"
    fill="#00c9a7" text-anchor="middle">🌍 INTERNATIONAL</text>

  <rect x="825" y="470" width="100" height="30" rx="15" ry="15"
    fill="#00c9a7" fill-opacity="0.08"
    stroke="#00c9a7" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="875" y="490"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="11" font-weight="600" letter-spacing="1"
    fill="#00c9a7" text-anchor="middle">V20 | 26</text>

  <!-- Phase 3 badge — new -->
  <rect x="935" y="470" width="100" height="30" rx="15" ry="15"
    fill="#00c9a7" fill-opacity="0.13"
    stroke="#00c9a7" stroke-width="1" stroke-opacity="0.5"/>
  <text x="985" y="490"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="11" font-weight="700" letter-spacing="1"
    fill="#00c9a7" text-anchor="middle">✦ PHASE 3</text>

  <!-- Brand footer -->
  <text x="1240" y="538"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="11" font-weight="600" letter-spacing="3"
    fill="#ffffff" opacity="0.22"
    text-anchor="end">SILENTIUM TECH</text>
  <text x="1240" y="556"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="11" font-weight="400" letter-spacing="1"
    fill="#00c9a7" opacity="0.40"
    text-anchor="end">echowabot.eu.org</text>

  <!-- BOTTOM GLOW STRIP -->
  <rect x="0" y="636" width="1280" height="4" fill="url(#barGrad)"/>
</svg>
